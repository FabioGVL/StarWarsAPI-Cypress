name: StarWarsAPI Automation

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare report directory
        run: mkdir -p cypress/reports

      - name: Cypress run
        continue-on-error: true
        uses: cypress-io/github-action@v7
        with:
          command: npx cypress run --reporter junit --reporter-options "mochaFile=cypress/reports/junit-[hash].xml,toConsole=true"

      - name: Upload Cypress report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-report
          path: |
            cypress/reports
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore
